<!doctype html>
<html lang="ja" data-device="ios" data-layout="gallery" data-mono="off">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>超イベント管理 スマホ画面モック</title>
<style>
/* ===========================================================
   デザイントークン
   docs/画面設計書_スマホ.md §5 の最終形。
   apps/web/src/styles.css の :root をそのままコピーできる状態で保つ。
   =========================================================== */
:root{
  /* --- 既存（apps/web/src/styles.css から維持） --- */
  --ink:#102a43; --muted:#66788a; --paper:#ffffff; --mist:#edf3f7; --line:#d7e1e8;
  --deadline:#d34b3f; --deadline-soft:#fff0ed;
  --event:#2a5bd7;  --event-soft:#eaf0ff;
  --verified:#15766d; --focus:#f4b942;
  /* --- 追加 --- */
  --partial:#a8621b; --partial-soft:#fff4e2;
  --muted-strong:#5a6b7c;
  --overlay:rgba(16,42,67,.45);
  --paper-sunken:#f7fafc;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --sh-card:0 1px 2px rgba(16,42,67,.06),0 2px 8px rgba(16,42,67,.05);
  --sh-sheet:0 -8px 32px rgba(16,42,67,.18);
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-15:15px; --fs-16:16px; --fs-20:20px; --fs-34:34px;
  --lh-tight:1.35; --lh-body:1.7;
  --tab-h:56px; --header-h:52px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --tab-total:calc(var(--tab-h) + var(--safe-b));
  --tap:44px; --gutter:16px; --shell-max:420px;
}
*{box-sizing:border-box}
html[data-mono="on"] .gallery{filter:grayscale(1)}

body{
  margin:0; background:#dde5ec; color:var(--ink);
  font-family:'Zen Kaku Gothic New',-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;
  -webkit-text-size-adjust:100%;
}

/* ============ モック専用ツールバー（電話枠の外） ============ */
.toolbar{
  position:sticky; top:0; z-index:50; background:var(--paper);
  border-bottom:1px solid var(--line); padding:12px 20px;
  display:flex; flex-wrap:wrap; gap:16px; align-items:center;
  box-shadow:0 1px 6px rgba(16,42,67,.08);
}
html[data-mono="on"] .toolbar{filter:none}
.toolbar h1{font-size:15px; margin:0; letter-spacing:.02em}
.toolbar h1 small{display:block; font-size:11px; font-weight:400; color:var(--muted-strong); letter-spacing:.08em}
.tgroup{display:flex; align-items:center; gap:6px}
.tgroup > span{font-size:11px; color:var(--muted-strong); letter-spacing:.08em}
.tgroup button{
  font:inherit; font-size:12px; padding:7px 11px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink); border-radius:var(--r-sm); cursor:pointer;
}
.tgroup button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.toolbar .note{font-size:11px; color:var(--muted-strong); max-width:34ch; line-height:1.6}

/* ============ ギャラリー & 端末フレーム ============ */
.gallery{padding:24px 20px 64px; display:flex; flex-wrap:wrap; gap:28px; align-items:flex-start}
html[data-layout="single"] .gallery{display:block}
html[data-layout="single"] .frame{display:none}
html[data-layout="single"] .frame.is-solo{display:block}

.frame{display:flex; flex-direction:column; gap:8px}
.frame figcaption{font-size:12px; line-height:1.5}
.frame figcaption b{font-size:13px}
.frame figcaption span{display:block; color:var(--muted-strong); font-size:11px}

/* 端末サイズ。data-device で切り替える */
html[data-device="ios"]     .phone{--dev-w:390px; --dev-h:844px; --safe-b:34px}
html[data-device="android"] .phone{--dev-w:360px; --dev-h:800px; --safe-b:0px}

.phone{
  width:var(--dev-w); height:var(--dev-h);
  background:var(--mist); border:1px solid var(--line); border-radius:24px;
  overflow:hidden; position:relative; box-shadow:0 10px 36px rgba(16,42,67,.16);
}
/* .app が実装上のシェル。タブバーは fixed ではなく sticky（設計書 §5.3） */
.app{
  max-width:var(--shell-max); margin-inline:auto; position:relative;
  height:100%; display:flex; flex-direction:column; background:var(--mist);
}
.scroll-area{flex:1; overflow-y:auto; overscroll-behavior:contain}

/* ============ ヘッダ ============ */
.app-header{
  min-height:var(--header-h); flex:none; background:var(--paper);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:var(--s3); padding:var(--s2) var(--gutter);
}
.app-header .h-main{flex:1; min-width:0}
.app-header .today{margin:0; font-size:var(--fs-11); color:var(--muted-strong); letter-spacing:.06em}
.app-header h2{margin:0; font-size:var(--fs-20); line-height:var(--lh-tight); font-weight:700}
.icon-btn{
  min-width:var(--tap); min-height:var(--tap); display:grid; place-items:center;
  border:1px solid var(--line); background:var(--paper); border-radius:var(--r-sm);
  font:inherit; font-size:var(--fs-12); color:var(--ink); cursor:pointer; padding:0 10px; gap:4px;
}
.icon-btn.primary{background:var(--ink); color:#fff; border-color:var(--ink)}
.back-btn{min-width:var(--tap); min-height:var(--tap); display:grid; place-items:center;
  border:0; background:transparent; font-size:20px; color:var(--ink); cursor:pointer}

/* ============ 進捗バナー（全タブ共通） ============ */
.run-banner{
  flex:none; background:var(--event-soft); border-bottom:1px solid #c9d8f7;
  padding:var(--s2) var(--gutter); display:grid; gap:6px;
}
.run-banner .rb-top{display:flex; align-items:baseline; gap:var(--s2); font-size:var(--fs-12)}
.run-banner .rb-step{font-weight:700; color:var(--event); flex:1; min-width:0}
.run-banner .rb-count{font-variant-numeric:tabular-nums; color:var(--muted-strong); font-size:var(--fs-11)}
.run-banner .rb-bar{height:4px; border-radius:var(--r-pill); background:#cedcf9; overflow:hidden}
.run-banner .rb-bar i{display:block; height:100%; background:var(--event); transition:width .4s ease}
.run-banner .rb-hint{font-size:var(--fs-11); color:var(--muted-strong)}
.run-banner[data-tone="partial"]{background:var(--partial-soft); border-bottom-color:#f0d9b0}
.run-banner[data-tone="partial"] .rb-step{color:var(--partial)}
.run-banner[data-tone="partial"] .rb-bar{background:#f0dfc4}
.run-banner[data-tone="partial"] .rb-bar i{background:var(--partial)}
.run-banner[data-tone="done"]{background:#e6f4f1; border-bottom-color:#bcdfd8}
.run-banner[data-tone="done"] .rb-step{color:var(--verified)}
.run-banner[data-tone="done"] .rb-bar i{background:var(--verified)}

/* ============ 締切カウントダウン ============ */
.hero{
  margin:var(--s4) var(--gutter) 0; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:var(--s4); box-shadow:var(--sh-card);
  display:grid; gap:var(--s1);
}
.hero p.lbl{margin:0; font-size:var(--fs-11); color:var(--muted-strong); letter-spacing:.08em}
.hero .cd{display:flex; align-items:baseline; gap:6px; color:var(--deadline)}
.hero .cd strong{font-size:var(--fs-34); line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.hero .cd span{font-size:var(--fs-13); font-weight:700}
.hero .cd-title{margin:0; font-size:var(--fs-13); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ============ フィルタ ============ */
.filters{
  display:flex; gap:var(--s2); padding:var(--s3) var(--gutter);
  overflow-x:auto; scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.filters button{
  flex:none; min-height:var(--tap); padding:0 var(--s4); border-radius:var(--r-pill);
  border:1px solid var(--line); background:var(--paper); color:var(--muted-strong);
  font:inherit; font-size:var(--fs-13); cursor:pointer; white-space:nowrap;
}
.filters button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:700}
.count-row{padding:0 var(--gutter) var(--s2); font-size:var(--fs-11); color:var(--muted-strong)}

/* ============ イベントカード ============ */
.list{display:grid; gap:var(--s3); padding:0 var(--gutter) var(--s4)}
.ev-card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:var(--s4); box-shadow:var(--sh-card); display:grid; gap:var(--s3);
  text-align:left; font:inherit; color:inherit; cursor:pointer; width:100%;
}
.ev-card[data-validation="partial"]{border-style:dashed; border-color:var(--partial)}
.ev-top{display:flex; gap:var(--s2); align-items:flex-start}
.ev-top .chips{flex:1; display:flex; flex-wrap:wrap; gap:6px; min-width:0}
.bookmark{
  flex:none; min-width:var(--tap); min-height:var(--tap); display:grid; place-items:center;
  border:1px solid var(--line); border-radius:var(--r-pill); background:var(--paper);
  font-size:16px; color:var(--muted-strong); cursor:pointer; line-height:1;
}
.bookmark[aria-pressed="true"]{color:var(--deadline); border-color:var(--deadline); background:var(--deadline-soft)}
.ev-title{margin:0; font-size:var(--fs-16); font-weight:700; line-height:var(--lh-tight);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.ev-meta{margin:0; font-size:var(--fs-12); color:var(--muted-strong); line-height:1.5}

.chip{
  font-size:var(--fs-11); padding:4px 9px; border-radius:var(--r-pill);
  background:var(--mist); color:var(--muted-strong); white-space:nowrap; line-height:1.4;
}
.chip.cat{background:var(--paper-sunken); border:1px solid var(--line)}
.chip.urgent{background:var(--deadline); color:#fff; font-weight:700}
.chip.partial{background:var(--partial-soft); color:var(--partial); border:1px dashed var(--partial); font-weight:700}
.chip.verified{background:transparent; color:var(--verified); padding-inline:0; font-weight:700}
.chip.cal-on{background:var(--event-soft); color:var(--event); font-weight:700}
.chip.cal-off{background:transparent; color:var(--muted-strong); border:1px solid var(--line)}

/* ---- デュアル日付レール（設計書 §3.3）---- */
.rail{display:grid; gap:0}
.rail .row{
  display:flex; align-items:center; gap:var(--s2);
  padding:var(--s2) var(--s3); border-left:4px solid transparent; border-radius:0 var(--r-sm) var(--r-sm) 0;
}
.rail .row .node{flex:none; width:8px; height:8px}
.rail .row .ico{flex:none; font-size:var(--fs-13); width:1.3em; text-align:center}
.rail .row .lbl{flex:none; font-size:var(--fs-11); font-weight:700; letter-spacing:.04em; width:5.2em}
.rail .row .val{flex:1; font-size:var(--fs-13); font-weight:700; font-variant-numeric:tabular-nums; min-width:0}
.rail .row .rel{flex:none; font-size:var(--fs-12)}
/* 上段 = 申込締切 : 塗り円・太字・--deadline */
.rail .row.deadline{background:var(--deadline-soft); border-left-color:var(--deadline)}
.rail .row.deadline .node{background:var(--deadline); border-radius:var(--r-pill)}
.rail .row.deadline .lbl{color:var(--deadline)}
.rail .row.deadline .rel{color:var(--deadline); font-weight:700; font-size:var(--fs-13)}
.rail .row.deadline.unknown{background:var(--partial-soft); border-left-style:dashed; border-left-color:var(--partial)}
.rail .row.deadline.unknown .node{background:transparent; border:2px solid var(--partial)}
.rail .row.deadline.unknown .lbl,.rail .row.deadline.unknown .val{color:var(--partial)}
/* 下段 = 開催日 : 角丸四角・通常ウェイト・--event */
.rail .row.held{background:var(--event-soft); border-left-color:var(--event)}
.rail .row.held .node{background:var(--event); border-radius:2px}
.rail .row.held .lbl{color:var(--event)}
.rail .row.held .rel{color:var(--muted-strong); font-weight:400}
/* 2つの日程の「間隔」 */
.rail .gap{
  display:flex; align-items:center; gap:var(--s2); padding:2px var(--s3) 2px calc(var(--s3) + 4px);
  font-size:var(--fs-11); color:var(--muted-strong);
}
.rail .gap i{display:block; width:2px; height:14px; background:var(--line); margin-left:3px}

.ev-foot{display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap}
.ev-foot .score{font-size:var(--fs-11); color:var(--muted-strong); font-weight:700}
.ev-foot .spacer{flex:1}
.cal-btn{
  min-height:var(--tap); padding:0 var(--s3); border-radius:var(--r-sm);
  border:1px solid var(--ink); background:var(--ink); color:#fff;
  font:inherit; font-size:var(--fs-12); font-weight:700; cursor:pointer; white-space:nowrap;
}
.cal-btn.done{background:var(--event-soft); color:var(--event); border-color:#bed0f6}

/* ============ 空状態 / スケルトン ============ */
.empty{margin:var(--s6) var(--gutter); background:var(--paper); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:var(--s6) var(--s4); text-align:center; display:grid; gap:var(--s3)}
.empty p{margin:0; font-size:var(--fs-13); color:var(--muted-strong); line-height:var(--lh-body)}
.empty strong{font-size:var(--fs-15)}

/* ============ 詳細 (S-02) ============ */
.detail{padding:0 var(--gutter) var(--s6); display:grid; gap:var(--s4)}
.notice{
  margin:var(--s4) 0 0; background:var(--partial-soft); border:1px dashed var(--partial);
  border-radius:var(--r-md); padding:var(--s3); font-size:var(--fs-12); color:var(--partial);
  line-height:var(--lh-body);
}
.notice strong{display:block; font-size:var(--fs-13)}
.notice ul{margin:6px 0 0; padding-left:1.2em}
.d-title{display:grid; gap:6px; margin-top:var(--s4)}
.d-title h3{margin:0; font-size:22px; line-height:var(--lh-tight); font-weight:700}
.sec{background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md);
  padding:var(--s4); display:grid; gap:var(--s2)}
.sec > h4{margin:0; font-size:var(--fs-11); letter-spacing:.08em; color:var(--muted-strong)}
.sec p{margin:0; font-size:var(--fs-13); line-height:var(--lh-body)}
.dl{display:grid; grid-template-columns:5.5em 1fr; gap:var(--s2) var(--s3); font-size:var(--fs-13); margin:0}
.dl dt{color:var(--muted-strong); font-size:var(--fs-12)}
.dl dd{margin:0}
.conf{display:grid; gap:6px}
.conf .bar{height:8px; border-radius:var(--r-pill); background:var(--mist); position:relative; overflow:hidden}
.conf .bar i{display:block; height:100%; background:var(--verified)}
.conf .bar u{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink); opacity:.45}
.conf .cap{font-size:var(--fs-11); color:var(--muted-strong)}
.linkrow{display:flex; align-items:center; gap:var(--s2); min-height:var(--tap);
  font-size:var(--fs-13); border-top:1px solid var(--line); padding-top:var(--s2)}
.linkrow:first-of-type{border-top:0; padding-top:0}
.linkrow .host{font-weight:700; word-break:break-all}
.linkrow .kind{flex:none; font-size:var(--fs-11); padding:3px 8px; border-radius:var(--r-pill);
  background:var(--mist); color:var(--muted-strong)}
.ghost-btn{min-height:var(--tap); width:100%; border:1px solid var(--line); background:var(--paper);
  border-radius:var(--r-sm); font:inherit; font-size:var(--fs-13); color:var(--ink); cursor:pointer}
.action-bar{
  flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--gutter);
  background:var(--paper); border-top:1px solid var(--line);
}
.action-bar .cal-btn{flex:1}

/* ============ カレンダー (S-03) ============ */
.cal-nav{display:flex; align-items:center; justify-content:center; gap:var(--s3); padding:var(--s3) var(--gutter)}
.cal-nav strong{font-size:var(--fs-16); font-variant-numeric:tabular-nums}
.seg{display:flex; margin:0 var(--gutter); border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:var(--paper)}
.seg button{flex:1; min-height:var(--tap); border:0; background:transparent; font:inherit;
  font-size:var(--fs-12); color:var(--muted-strong); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink); color:#fff; font-weight:700}
.dow{display:grid; grid-template-columns:repeat(7,1fr); padding:var(--s3) var(--gutter) var(--s1);
  font-size:var(--fs-11); text-align:center; color:var(--muted-strong)}
.dow span:first-child{color:var(--deadline)} .dow span:last-child{color:var(--event)}
.grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; margin:0 var(--gutter);
  background:var(--line); border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden}
.cell{
  position:relative; height:56px; background:var(--paper); border:0; font:inherit; cursor:pointer;
  display:block; padding:6px 0 0; text-align:center; font-size:var(--fs-12); color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.cell.out{color:var(--muted-strong); opacity:.35}
.cell[aria-pressed="true"]{background:var(--mist); box-shadow:inset 0 0 0 2px var(--ink)}
.cell .today-dot{display:block; width:4px; height:4px; border-radius:var(--r-pill);
  background:var(--ink); margin:2px auto 0}
/* 締切 = 右上の塗り円 / 開催 = 下端の帯 */
.cell .mk-dl{position:absolute; top:5px; right:5px; width:6px; height:6px; border-radius:var(--r-pill); background:var(--deadline)}
.cell .mk-ev{position:absolute; bottom:5px; left:2px; right:2px; height:3px; background:var(--event)}
.cell .mk-ev.s{border-top-left-radius:2px; border-bottom-left-radius:2px; left:4px}
.cell .mk-ev.e{border-top-right-radius:2px; border-bottom-right-radius:2px; right:4px}
.legend{display:flex; gap:var(--s4); padding:var(--s3) var(--gutter); font-size:var(--fs-11); color:var(--muted-strong)}
.legend b{display:inline-flex; align-items:center; gap:5px; font-weight:400}
.legend .k-dl{width:7px; height:7px; border-radius:var(--r-pill); background:var(--deadline)}
.legend .k-ev{width:14px; height:3px; background:var(--event)}
.agenda{padding:0 var(--gutter) var(--s4); display:grid; gap:var(--s3)}
.agenda h4{margin:0; font-size:var(--fs-15); font-variant-numeric:tabular-nums}
.agenda .grp{display:grid; gap:6px}
.agenda .grp > span{font-size:var(--fs-11); color:var(--muted-strong); letter-spacing:.06em}
.agenda .row{
  display:flex; align-items:center; gap:var(--s2); min-height:var(--tap);
  background:var(--paper); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:var(--s2) var(--s3); font:inherit; font-size:var(--fs-13); text-align:left;
  cursor:pointer; color:inherit; width:100%;
}
.agenda .row .m{flex:none}
.agenda .row .t{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.agenda .row .w{flex:none; font-size:var(--fs-11); color:var(--muted-strong); font-variant-numeric:tabular-nums}
.agenda .row.dl{border-left:4px solid var(--deadline)}
.agenda .row.ev{border-left:4px solid var(--event)}
.agenda .row.unk{border-left:4px dashed var(--partial)}

/* ============ 設定 (S-05) ============ */
.settings{padding:var(--s4) var(--gutter) var(--s6); display:grid; gap:var(--s4)}
.s-row{display:flex; align-items:center; gap:var(--s3); min-height:var(--tap); font-size:var(--fs-13)}
.s-row .k{flex:1; min-width:0}
.s-row .k small{display:block; font-size:var(--fs-11); color:var(--muted-strong); line-height:1.5}
.s-row .v{flex:none; font-size:var(--fs-12); color:var(--muted-strong)}
.s-row + .s-row{border-top:1px solid var(--line)}
.switch{
  flex:none; width:var(--tap); height:var(--tap); border:0; background:transparent;
  position:relative; cursor:pointer; padding:0;
}
/* 見た目のトラックは 44x26。当たり判定は 44x44 を確保する（§5.2 --tap） */
.switch::before{content:""; position:absolute; top:9px; left:0; width:44px; height:26px;
  border-radius:var(--r-pill); border:1px solid var(--line); background:var(--mist)}
.switch::after{content:""; position:absolute; top:12px; left:3px; width:20px; height:20px;
  border-radius:var(--r-pill); background:var(--paper); box-shadow:0 1px 3px rgba(16,42,67,.25); transition:left .18s}
.switch[aria-checked="true"]::before{background:var(--event); border-color:var(--event)}
.switch[aria-checked="true"]::after{left:21px}
.switch[disabled]{opacity:.45; cursor:not-allowed}
.mock-tag{font-size:var(--fs-11); padding:3px 8px; border-radius:var(--r-pill);
  background:var(--partial-soft); color:var(--partial); font-weight:700}

var WD = ['日','月','火','水','木','金','土'];

/* 日時は必ずイベントの dates.timezone で解釈する（設計書 §3.2）。
   端末やサーバのローカルTZで解釈すると時刻がずれる。このプロダクトでは致命的。 */
function parts(iso, tz){
  var f = new Intl.DateTimeFormat('en-US', {
    timeZone: tz || 'Asia/Tokyo', year:'numeric', month:'numeric', day:'numeric',
    hour:'2-digit', minute:'2-digit', hour12:false
  });
  var o = {};
  f.formatToParts(new Date(iso)).forEach(function(x){ o[x.type] = x.value; });
  return { y:+o.year, m:+o.month, d:+o.day, hh:o.hour, mm:o.minute };
}
function ymd(dt){ return dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate(); }
function md(iso, tz){ var p = parts(iso, tz); return p.m+'月'+p.d+'日'; }
function hm(iso, tz){ var p = parts(iso, tz); return p.hh+':'+p.mm; }
/* そのタイムゾーンでの「暦日」。カレンダーの索引と日数差の基準にする */
function dayKey(iso, tz){ var p = parts(iso, tz); return p.y+'-'+p.m+'-'+p.d; }
function dayDate(iso, tz){ var p = parts(iso, tz); return new Date(p.y, p.m-1, p.d); }
function dayIndex(iso, tz){ var p = parts(iso, tz); return Date.UTC(p.y, p.m-1, p.d) / DAY; }

  var iso = ev.dates.applicationDeadline, tz = ev.dates.timezone;
  if(!iso) return '未確認';
  /* precision='date' のとき時刻を出さない。「23:59」を捏造しない（§3.2） */
  return ev.dates.applicationDeadlinePrecision === 'date' ? md(iso, tz) : md(iso, tz)+' '+hm(iso, tz);
}
function heldLabel(ev){
  var tz = ev.dates.timezone, s = ev.dates.eventStart, e = ev.dates.eventEnd;
  if(e && dayKey(e, tz) !== dayKey(s, tz)) return md(s, tz)+' — '+md(e, tz);
  return md(s, tz) + (ev.dates.eventStartPrecision === 'datetime' ? ' '+hm(s, tz) : '');
}
/* 残り日数は暦日どうしの差で数える。時刻の端数で1日ずれるのを防ぐ */
function daysLeft(iso, tz){
  if(!iso) return null;
  return dayIndex(iso, tz) - dayIndex(TODAY_ISO, tz);

  var n = daysLeft(iso, tz);
  if(n === null) return '';
  if(n < 0) return '終了';
  if(n === 0) return '今日';
  return suffix === 'left' ? 'あと'+n+'日' : n+'日後';

function runBannerHtml(){
  if(!STATE.run.active) return '';
  var i = STATE.run.index;
  var st = RUN_STEPS[i] || RUN_STEPS[0];
  var done = st.id === 'completed';
  var tone = done ? (STATE.run.tone === 'partial' ? 'partial' : 'done') : 'run';
  var pct = Math.round(((i+1) / RUN_STEPS.length) * 100);
  var msg = done
    ? (STATE.run.tone === 'partial'
        ? '4件を更新しました（1件は情報不足のため保留）'
        : '5件のイベントを更新しました')
    : st.label;
  return ''
  + '<div class="run-banner" data-tone="'+tone+'" role="status">'
  +   '<div class="rb-top"><span class="rb-step">'+esc(msg)+'</span>'
  +     '<span class="rb-count">'+(i+1)+' / '+RUN_STEPS.length+'</span></div>'
  +   '<div class="rb-bar"><i style="width:'+pct+'%"></i></div>'
  +   (st.hint && !done ? '<p class="rb-hint">'+esc(st.hint)+'</p>' : '')
  +   (done ? '' : '<p class="rb-hint">閉じても探索は続きます。</p>')
  + '</div>';
}

/* ---------------- S-03 カレンダー ---------------- */
function calendarHtml(){
  var evs = visibleEvents();
  var dlIdx = {}, evIdx = {}, unknown = [];
  evs.forEach(function(ev){
    var tz = ev.dates.timezone, dl = ev.dates.applicationDeadline;
    /* 締切が null のイベントは締切マーカーを描かない。推測しない（§3.2） */
    if(dl){ var k = dayKey(dl, tz); (dlIdx[k] = dlIdx[k] || []).push(ev); }
    else unknown.push(ev);
    var s = dayDate(ev.dates.eventStart, tz);
    var e = ev.dates.eventEnd ? dayDate(ev.dates.eventEnd, tz) : s;
    var sk = ymd(s), ek = ymd(e);
    for(var t = new Date(s.getTime()); t <= e; t.setDate(t.getDate()+1)){
      var k2 = ymd(t);
      (evIdx[k2] = evIdx[k2] || []).push({ ev:ev, first:k2===sk, last:k2===ek });
    }
  });

  var Y = 2026, M = 9; /* 2026年10月 */
  var first = new Date(Y, M, 1);
  var start = new Date(Y, M, 1 - first.getDay());
  var cells = '';
  for(var i = 0; i < 42; i++){
    var day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    var key = ymd(day), out = day.getMonth() !== M;
    var hasDl = !!dlIdx[key], spans = evIdx[key] || [];
    var sel = key === STATE.calSelected;
    var isToday = key === dayKey(TODAY_ISO, 'Asia/Tokyo');
    var lbl = (day.getMonth()+1)+'月'+day.getDate()+'日'
      + (hasDl ? ' 申込締切'+dlIdx[key].length+'件' : '')
      + (spans.length ? ' 開催'+spans.length+'件' : '');
    cells += '<button class="cell'+(out?' out':'')+'" data-day="'+key+'"'
      + ' aria-pressed="'+(sel?'true':'false')+'" aria-label="'+lbl+'">'
      + day.getDate()
      + (isToday ? '<span class="today-dot" aria-hidden="true"></span>' : '')
      + (hasDl ? '<span class="mk-dl" aria-hidden="true"></span>' : '')
      + (spans.length ? '<span class="mk-ev'+(spans[0].first?' s':'')+(spans[0].last?' e':'')+'" aria-hidden="true"></span>' : '')
      + '</button>';
  }

  var sk = STATE.calSelected, sd = new Date(sk.split('-')[0], sk.split('-')[1]-1, sk.split('-')[2]);
  var dls = dlIdx[sk] || [], sps = evIdx[sk] || [];
  var agenda = '<h4>'+(sd.getMonth()+1)+'月'+sd.getDate()+'日('+WD[sd.getDay()]+')</h4>';
  if(dls.length) agenda += '<div class="grp"><span>申込締切 ('+dls.length+')</span>' + dls.map(function(ev){
    var t = ev.dates.applicationDeadlinePrecision === 'date' ? '時刻未確認' : hm(ev.dates.applicationDeadline, ev.dates.timezone);
    return '<button class="row dl" data-open="'+ev.eventId+'"><span class="m" aria-hidden="true">🚨</span>'
      + '<span class="t">'+esc(ev.title)+'</span><span class="w">'+t+'</span></button>';
  }).join('') + '</div>';
  if(sps.length) agenda += '<div class="grp"><span>開催 ('+sps.length+')</span>' + sps.map(function(x){
    var ev = x.ev, tz = ev.dates.timezone;
    var multi = ev.dates.eventEnd && dayKey(ev.dates.eventEnd, tz) !== dayKey(ev.dates.eventStart, tz);
    return '<button class="row ev" data-open="'+ev.eventId+'"><span class="m" aria-hidden="true">📅</span>'
      + '<span class="t">'+esc(ev.title)+'</span><span class="w">'+(multi?'2日間':hm(ev.dates.eventStart, tz))+'</span></button>';
  }).join('') + '</div>';
  if(!dls.length && !sps.length) agenda += '<p class="ev-meta">この日に予定はありません。</p>';
  /* 締切未確認を黙って落とさない（§3.1 / S-03の制約） */
  if(unknown.length) agenda += '<div class="grp"><span>締切未確認 ('+unknown.length+')</span>' + unknown.map(function(ev){
    return '<button class="row unk" data-open="'+ev.eventId+'"><span class="m" aria-hidden="true">○</span>'
      + '<span class="t">'+esc(ev.title)+'</span><span class="w">—</span></button>';
  }).join('') + '</div>';

  return ''
  + '<header class="app-header"><div class="h-main"><h2 style="font-size:var(--fs-16)">カレンダー</h2></div>'
  +   '<button class="icon-btn">今日</button></header>'
  + runBannerHtml()
  + '<div class="scroll-area">'
  +   '<div class="cal-nav"><button class="back-btn" aria-label="前の月">‹</button>'
  +     '<strong>2026年10月</strong><button class="back-btn" aria-label="次の月">›</button></div>'
  +   '<div class="seg" role="group" aria-label="表示する軸">'
  +     '<button aria-pressed="true">両方</button><button aria-pressed="false">締切のみ</button>'
  +     '<button aria-pressed="false">開催のみ</button></div>'
  +   '<div class="dow">'+WD.map(function(w){return '<span>'+w+'</span>';}).join('')+'</div>'
  +   '<div class="grid">'+cells+'</div>'
  +   '<div class="legend"><b><i class="k-dl"></i>申込締切（点）</b><b><i class="k-ev"></i>開催日（帯）</b></div>'
  +   '<div class="agenda">'+agenda+'</div>'
  + '</div>'
  + tabbarHtml('calendar');
}

  +     '<div class="bubble user">大阪の生成AIハッカソンを探して</div>'
  +     '<div class="bubble agent">大阪で開催される生成AI関連のハッカソンを探します。対象年は2026年、オンライン併催も含めます。</div>'
  +     '<div class="ss-slot">Search Suggestions 表示位置<br>Google提供のHTMLを無改変で挿入する（§3.7 / §6.4）。折りたたみ・再スタイル・非表示は禁止。</div>'
  +     (active && RUN_STEPS[i] && RUN_STEPS[i].id === 'completed'
        ? '<div class="bubble agent">5件のイベントを更新しました。ホームで確認できます。</div>'
        : active ? '<div class="bubble system">'+esc(RUN_STEPS[i] ? RUN_STEPS[i].label : '探索を開始しました')+'</div>' : '')
  +   '</div>'
  +   '<div class="suggest">'
  +     '<button>関西の生成AIハッカソンを探して</button>'
  +     '<button>オンラインのミートアップも入れて</button>'
  +     '<button data-run="1">イベントを更新して</button></div>'
  +   '<form class="composer" onsubmit="return false">'
  +     '<label class="sr-only" for="ci">エージェントへのメッセージ</label>'
  +     '<textarea id="ci" rows="1" placeholder="例: 大阪のGCPハッカソンを探して"></textarea>'
  +     '<button type="submit">送信</button></form>'
  + '</div>';
}

/* ---------------- S-07 カレンダー登録シート ---------------- */
function sheetHtml(id){
  var ev = byId(id);
  var canDl = !!ev.dates.applicationDeadline;
  var sel = SHEET.sel;
  var label = (sel.dl && sel.main) ? '両方まとめて登録'
            : sel.dl ? '申込締切を登録'
            : sel.main ? '本番日程を登録' : '登録する項目を選択してください';
  var disabled = (!sel.dl && !sel.main);
  return ''
  + '<div class="backdrop" data-close="1"></div>'
  + '<section class="sheet" role="dialog" aria-modal="true" aria-label="カレンダーに登録">'
  +   '<div class="sheet-handle"><i></i></div>'
  +   '<div class="sh-body">'
  +     '<h3>カレンダーに登録</h3><p class="sub">'+esc(ev.title)+'</p>'
  +     '<div class="opt" role="checkbox" aria-checked="'+(canDl && sel.dl)+'"'
  +       (canDl?' data-toggle="dl"':' aria-disabled="true"')+' tabindex="0">'
  +       '<span class="box" aria-hidden="true">'+(canDl && sel.dl?'✓':'')+'</span><span class="txt">'
  +       '<b>申込締切をリマインダーとして登録</b><small>'
  +       (canDl ? esc(deadlineLabel(ev))+' · 1日前と3時間前に通知'
                 : '申込締切が未確認のため登録できません')+'</small></span></div>'
  +     '<div class="opt" role="checkbox" aria-checked="'+sel.main+'" data-toggle="main" tabindex="0">'
  +       '<span class="box" aria-hidden="true">'+(sel.main?'✓':'')+'</span><span class="txt">'
  +       '<b>本番日程を登録</b><small>'+esc(heldLabel(ev))+'</small></span></div>'
  +     '<div class="s-row"><span class="k">登録先</span><span class="v">yuya@example.com（モック）</span></div>'
  +     '<p class="warn">⚠ デモ版です。実際のGoogleカレンダーには書き込みません。</p>'
  +     '<button class="cta" data-confirm="'+ev.eventId+'"'+(disabled?' disabled':'')+'>'+esc(label)+'</button>'
  +     '<button class="ghost-btn" data-close="1">キャンセル</button>'
  +   '</div>'
  + '</section>';
}

/* ============================================================
   フレーム描画
   ============================================================ */
var SHEET = { open:false, id:null, sel:{dl:true, main:true} };

var FRAMES = [
  {id:'S-01', name:'ホーム / イベント一覧', feat:'F-02, F-03, F-05', screen:'home'},
  {id:'S-02', name:'イベント詳細（verified）', feat:'F-03, F-04, F-05', screen:'detail', ev:'gemini-hack-2026'},
  {id:'S-02', name:'イベント詳細（partial・締切未確認）', feat:'§3.1 / §6.6', screen:'detail', ev:'kansai-demoday-2026'},
  {id:'S-07', name:'カレンダー登録シート', feat:'F-04 / §10.4', screen:'detail', ev:'gemini-hack-2026', sheet:'gemini-hack-2026'},
  {id:'S-07', name:'カレンダー登録シート（締切未確認 → 無効化）', feat:'§3.2', screen:'detail', ev:'kansai-demoday-2026', sheet:'kansai-demoday-2026'},
  {id:'S-03', name:'カレンダー（2軸月表示）', feat:'F-03', screen:'calendar'},
  {id:'S-04', name:'保存済み', feat:'F-05', screen:'saved'},
  {id:'S-05', name:'設定', feat:'F-01', screen:'settings'},
  {id:'S-06', name:'エージェントチャット', feat:'F-01, F-02', screen:'chat'}
];

function screenHtml(screen, evId){
  if(screen === 'home')     return homeHtml();
  if(screen === 'detail')   return detailHtml(evId);
  if(screen === 'calendar') return calendarHtml();
  if(screen === 'saved')    return savedHtml();
  if(screen === 'settings') return settingsHtml();
  if(screen === 'chat')     return chatHtml();
  return '';
}

function buildFrames(){
  var g = document.getElementById('gallery');
  g.innerHTML = FRAMES.map(function(f, i){
    return '<figure class="frame'+(i===0?' is-solo':'')+'" data-frame="'+i+'">'
      + '<figcaption><b>'+f.id+'　'+esc(f.name)+'</b><span>'+esc(f.feat)+'</span></figcaption>'
      + '<div class="phone" data-screen="'+f.screen+'" data-ev="'+(f.ev||'')+'"'
      +   (f.sheet?' data-sheet="'+f.sheet+'"':'')+'><div class="app"></div></div>'
      + '</figure>';
  }).join('');
  renderAll();
}

function renderAll(){
  var phones = document.querySelectorAll('.phone');
  for(var i = 0; i < phones.length; i++){
    var p = phones[i];
    var app = p.querySelector('.app');
    app.innerHTML = screenHtml(p.dataset.screen, p.dataset.ev);
    /* シート付きフレームは常に開いた状態で見せる。それ以外は操作で開く */
    var sheetFor = p.dataset.sheet || (SHEET.open && p === SHEET.phone ? SHEET.id : null);
    var old = p.querySelectorAll('.backdrop,.sheet');
    for(var k = 0; k < old.length; k++) old[k].remove();
    if(sheetFor){
      var ev = byId(sheetFor);
      var saveSel = SHEET.sel;
      if(p.dataset.sheet) SHEET.sel = { dl: !!ev.dates.applicationDeadline, main:true };
      p.insertAdjacentHTML('beforeend', sheetHtml(sheetFor));
      SHEET.sel = saveSel;
    }
  }
}

/* ============================================================
   操作
   ============================================================ */
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-set],[data-tab],[data-open],[data-save],[data-cal],[data-day],[data-run],[data-toggle],[data-confirm],[data-close],[data-evidence]') : null;
  if(!t) return;
  var phone = t.closest('.phone');

  /* ツールバー */
  if(t.dataset.set){
    var key = t.dataset.set, val = t.dataset.val;
    if(key === 'mono'){
      var on = document.documentElement.dataset.mono === 'on';
      document.documentElement.dataset.mono = on ? 'off' : 'on';
      t.setAttribute('aria-pressed', on ? 'false' : 'true');
    } else {
      document.documentElement.dataset[key] = val;
      var sibs = t.parentNode.querySelectorAll('button');
      for(var i=0;i<sibs.length;i++) sibs[i].setAttribute('aria-pressed', sibs[i]===t ? 'true':'false');
      if(key === 'layout'){
        var frames = document.querySelectorAll('.frame');
        for(var j=0;j<frames.length;j++) frames[j].classList.toggle('is-solo', j===0);
      }
    }
    return;
  }
  if(!phone) return;
  e.preventDefault();

  if(t.dataset.tab){ phone.dataset.screen = t.dataset.tab; phone.removeAttribute('data-sheet'); renderAll(); return; }
  if(t.dataset.open){ phone.dataset.screen = 'detail'; phone.dataset.ev = t.dataset.open; renderAll(); return; }
  if(t.dataset.day){ STATE.calSelected = t.dataset.day; renderAll(); return; }
  if(t.dataset.save){
    var id = t.dataset.save;
    STATE.saved[id] = !STATE.saved[id];
    var ev0 = byId(id); if(ev0) ev0.status = STATE.saved[id] ? 'bookmarked' : 'suggested';
    renderAll(); return;
  }
  if(t.dataset.evidence){ window.alert('S-08 根拠シート\n\n根拠取得APIが未実装のため、モックでは省略しています。\n設計書 §4「S-08」および §7 の契約ギャップ4を参照。'); return; }
  if(t.dataset.cal){
    var ev1 = byId(t.dataset.cal);
    SHEET.open = true; SHEET.id = t.dataset.cal; SHEET.phone = phone;
    SHEET.sel = { dl: !!ev1.dates.applicationDeadline, main:true };
    phone.dataset.sheet = t.dataset.cal; renderAll(); return;
  }
  if(t.dataset.close){ SHEET.open = false; SHEET.phone = null; phone.removeAttribute('data-sheet'); renderAll(); return; }
  if(t.dataset.toggle){
    var k2 = t.dataset.toggle;
    SHEET.sel[k2] = !SHEET.sel[k2];
    var sheetId = phone.dataset.sheet || SHEET.id;
    phone.removeAttribute('data-sheet');
    SHEET.open = true; SHEET.id = sheetId; SHEET.phone = phone;
    renderAll();
    /* data-sheet を使わず SHEET 状態で描き直す */
    return;
  }
  if(t.dataset.confirm){
    /* 実連携時はこの1箇所（lib/calendarMock.ts の registerToCalendar）だけを差し替える */
    STATE.calendar[t.dataset.confirm] = {
      deadlineEventId: SHEET.sel.dl ? 'mock-dl-'+t.dataset.confirm : null,
      mainEventId:     SHEET.sel.main ? 'mock-mn-'+t.dataset.confirm : null
    };
    SHEET.open = false; SHEET.phone = null; phone.removeAttribute('data-sheet');
    renderAll();
    window.alert('カレンダーに登録しました（デモ）\n\n実際のGoogleカレンダーには書き込んでいません。');
    return;
  }
  if(t.dataset.run){ startFakeRun(); return; }
});

/* Run の疑似実行。8ステップを約12秒で進める */
var runTimer = null;
function startFakeRun(){
  if(runTimer) window.clearInterval(runTimer);
  STATE.run = { active:true, index:0, tone:'partial' };
  renderAll();
  runTimer = window.setInterval(function(){
    STATE.run.index++;
    if(STATE.run.index >= RUN_STEPS.length){
      STATE.run.index = RUN_STEPS.length - 1;
      window.clearInterval(runTimer); runTimer = null;
    }
    renderAll();
  }, 1500);
}

/* 初期化 */
buildFrames();
document.querySelector('[data-set="device"][data-val="ios"]').setAttribute('aria-pressed','true');
document.querySelector('[data-set="layout"][data-val="gallery"]').setAttribute('aria-pressed','true');
document.getElementById('monoBtn').setAttribute('aria-pressed','false');
</script>
