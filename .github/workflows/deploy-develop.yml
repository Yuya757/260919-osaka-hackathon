name: Deploy develop

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/web/**'
      - 'services/agent/**'
      - 'packages/contracts/**'
      - 'evals/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-develop.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # テストと評価データセットが通らない限りデプロイしない（§13.3）。
  # 別ファイルのジョブは needs で繋げないので、再利用可能ワークフローとして呼ぶ。
  tests:
    name: Tests and evaluation
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  agent:
    needs: tests
    name: Build and deploy agent API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      service_url: ${{ steps.deploy.outputs.url }}
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push agent image
        id: build
        working-directory: services/agent
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/apps/event-agent:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run service
        id: deploy
        run: |
          gcloud run deploy event-agent \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "event-agent-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --no-invoker-iam-check \
            --set-env-vars "^|^GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}|GCP_REGION=${{ vars.GCP_REGION }}|GEMINI_MODEL=gemini-3.8-flash|AGENT_DEMO_MODE=false|DEMO_CATALOG_FALLBACK=false|MANUAL_RUNS_ENABLED=true|FIRESTORE_ENABLED=true|CORS_ORIGINS=https://${{ vars.FIREBASE_SITE_ID }}.web.app,http://localhost:5173|EKISPERT_API_KEY=${{ secrets.EKISPERT_API_KEY }}" \
            --quiet
          URL="$(gcloud run services describe event-agent --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" --format='value(status.url)')"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  firestore_rules:
    needs: tests
    name: Deploy Firestore rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        # `firestore:rules` に絞る。firestore.indexes.json は空で、複合
        # インデックスを足すまでは roles/datastore.indexAdmin を持たせる理由が
        # ない（ADR-002）。
        run: >
          npx --yes firebase-tools@14.16.0 deploy
          --only firestore:rules
          --project ${{ vars.GCP_PROJECT_ID }}
          --non-interactive

  collection_job:
    needs: [tests, agent]
    name: Deploy daily collection job
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy the daily collection Cloud Run Job
        # §14 Phase 2 の定期収集。Cloud Scheduler はまだ作っていないので、この
        # Job は手動実行（gcloud run jobs execute）でしか動かない。ADR-003 参照。
        # --max-retries 0 は意図的。§9.3 のロックは二重収集を防ぐが、claim 後に
        # 落ちた実行の再開はしないため、自動リトライは同じ日を再収集せずに
        # 成功終了してしまう。失敗は気づけるほうがよい。
        run: |
          gcloud run jobs deploy event-agent-daily \
            --image "${{ needs.agent.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "event-agent-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --command=python \
            --args="-m,event_agent.entrypoints.job" \
            --max-retries 0 \
            --task-timeout 300s \
            --set-env-vars "^|^GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}|GCP_REGION=${{ vars.GCP_REGION }}|GEMINI_MODEL=gemini-3.8-flash|AGENT_DEMO_MODE=false|DEMO_CATALOG_FALLBACK=false|FIRESTORE_ENABLED=true" \
            --quiet

  web:
    name: Build and deploy web demo
    needs: [tests, agent]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: develop
      url: https://${{ vars.FIREBASE_SITE_ID }}.web.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: apps/web
        run: pnpm run check

      - name: Build
        working-directory: apps/web
        run: pnpm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: >
          npx --yes firebase-tools@14.16.0 deploy
          --only hosting
          --project ${{ vars.GCP_PROJECT_ID }}
          --non-interactive
